<svg viewBox="0 0 860 660" width="860" height="660" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="660" fill="#ffffff"/>
  <text x="20" y="638" font-size="11" fill="#94a3b8">One poll to IBM every 12 s, regardless of how many clients are connected.</text>

  <!-- IBM Cloud -->
  <rect x="20" y="16" width="820" height="104" rx="8" fill="none" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text x="32" y="36" font-size="12" fill="#64748b">IBM Quantum Cloud — external, rate limited</text>
  <g>
    <rect x="60" y="52" width="330" height="56" rx="4" fill="#f3e8ff" stroke="#c084fc" stroke-width="0.5"/>
    <text x="76" y="76" font-size="14" font-weight="500" fill="#581c87">IAM token service</text>
    <text x="76" y="94" font-size="12" fill="#7e22ce">iam.cloud.ibm.com · 1 hour token</text>
  </g>
  <g>
    <rect x="450" y="52" width="330" height="56" rx="4" fill="#f3e8ff" stroke="#c084fc" stroke-width="0.5"/>
    <text x="466" y="76" font-size="14" font-weight="500" fill="#581c87">Qiskit Runtime API</text>
    <text x="466" y="94" font-size="12" fill="#7e22ce">/v1/backends · /v1/jobs</text>
  </g>

  <!-- FastAPI backend -->
  <rect x="20" y="168" width="820" height="236" rx="8" fill="none" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text x="32" y="188" font-size="12" fill="#64748b">FastAPI backend — single process, single poller</text>
  <g>
    <rect x="50" y="210" width="210" height="60" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.5"/>
    <text x="66" y="236" font-size="14" font-weight="500" fill="#075985">ibm_client.py</text>
    <text x="66" y="254" font-size="12" fill="#0369a1">Token cache + typed calls</text>
  </g>
  <g>
    <rect x="290" y="210" width="210" height="60" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.5"/>
    <text x="306" y="236" font-size="14" font-weight="500" fill="#075985">poller.py</text>
    <text x="306" y="254" font-size="12" fill="#0369a1">asyncio loop · every 12 s</text>
  </g>
  <g>
    <rect x="540" y="210" width="220" height="60" rx="4" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="0.5"/>
    <text x="556" y="236" font-size="14" font-weight="500" fill="#115e59">TTLCache</text>
    <text x="556" y="254" font-size="12" fill="#0f766e">One source of truth</text>
  </g>
  <g>
    <rect x="290" y="310" width="210" height="60" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="0.5"/>
    <text x="306" y="336" font-size="14" font-weight="500" fill="#78350f">mock_service.py</text>
    <text x="306" y="354" font-size="12" fill="#92400e">Fallback on failure</text>
  </g>
  <g>
    <rect x="540" y="310" width="220" height="60" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.5"/>
    <text x="556" y="336" font-size="14" font-weight="500" fill="#075985">websocket.py + rest.py</text>
    <text x="556" y="354" font-size="12" fill="#0369a1">Reads cache only</text>
  </g>

  <!-- Frontend -->
  <rect x="20" y="436" width="820" height="176" rx="8" fill="none" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text x="32" y="456" font-size="12" fill="#64748b">React frontend — many tabs, still one poll</text>
  <g>
    <rect x="540" y="468" width="220" height="56" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="0.5"/>
    <text x="556" y="492" font-size="14" font-weight="500" fill="#14532d">useQuantumTelemetry</text>
    <text x="556" y="510" font-size="12" fill="#166534">WebSocket + backoff</text>
  </g>
  <g>
    <rect x="60" y="546" width="170" height="48" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.5"/>
    <text x="74" y="566" font-size="14" font-weight="500" fill="#1e293b">QPU grid</text>
    <text x="74" y="582" font-size="12" fill="#475569">Status + queue</text>
  </g>
  <g>
    <rect x="250" y="546" width="170" height="48" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.5"/>
    <text x="264" y="566" font-size="14" font-weight="500" fill="#1e293b">Queue chart</text>
    <text x="264" y="582" font-size="12" fill="#475569">Depth over time</text>
  </g>
  <g>
    <rect x="440" y="546" width="170" height="48" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.5"/>
    <text x="454" y="566" font-size="14" font-weight="500" fill="#1e293b">Job stream</text>
    <text x="454" y="582" font-size="12" fill="#475569">Live status pills</text>
  </g>
  <g>
    <rect x="630" y="546" width="170" height="48" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.5"/>
    <text x="644" y="566" font-size="14" font-weight="500" fill="#1e293b">Mode toggle</text>
    <text x="644" y="582" font-size="12" fill="#475569">Live vs simulated</text>
  </g>

  <!-- edges -->
  <g stroke="#64748b" stroke-width="0.5" fill="none">
    <path d="M 120 210 L 120 112" marker-end="url(#arrow)"/>
    <path d="M 200 210 L 200 140 L 600 140 L 600 112" marker-end="url(#arrow)"/>
    <path d="M 290 240 L 264 240" marker-end="url(#arrow)"/>
    <path d="M 500 240 L 536 240" marker-end="url(#arrow)"/>
    <path d="M 340 270 L 340 306" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
    <path d="M 650 270 L 650 306" marker-end="url(#arrow)"/>
    <path d="M 650 370 L 650 464" marker-end="url(#arrow)"/>
    <path d="M 650 524 L 650 530 M 145 530 L 715 530"/>
    <path d="M 145 530 L 145 542" marker-end="url(#arrow)"/>
    <path d="M 335 530 L 335 542" marker-end="url(#arrow)"/>
    <path d="M 525 530 L 525 542" marker-end="url(#arrow)"/>
    <path d="M 715 530 L 715 542" marker-end="url(#arrow)"/>
  </g>
</svg>
